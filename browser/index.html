<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Endless Corridor</title>
<style>
:root{--bg:#14121c;--fg:#f3ead7;--acc:#ffb347;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;padding:6px 10px;font-weight:700;font-size:14px}
#hp{color:#ff6b6b;min-width:70px;letter-spacing:1px}
#inkw{flex:1;height:12px;background:#0007;border-radius:6px;overflow:hidden}
#ink{height:100%;background:#5b8cff;width:100%}
#stage{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:8px;right:8px;top:6px;text-align:center;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s}
#ctl{display:flex;gap:10px;padding:8px 10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:52px;color:#1b1406;background:var(--acc)}
#clear{flex:1;background:#4a4760;color:var(--fg)}
#cast{flex:2.5;font-size:18px}
button:disabled{opacity:.4}
#skills{display:flex;gap:8px;padding:0 10px 8px;height:92px}
.slot{flex:1;min-width:0;background:#2a2638;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent;gap:1px;overflow:hidden}
.slot.hot{border-color:var(--acc)}
.slot canvas{width:40px;height:40px;border-radius:6px}
.slot b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 3px}
.slot span{opacity:.7}
.cd{display:block;width:80%;height:4px;background:#0007;border-radius:2px;overflow:hidden}
.cd u{display:block;height:100%;width:0;background:var(--acc)}
#ov{position:absolute;inset:0;overflow:auto;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000c;padding:16px;text-align:center;z-index:5}
#ov h2{margin:0}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.card{min-height:84px;padding:10px;background:#3a3550;color:var(--fg);font-weight:400;font-size:13px;display:flex;flex-direction:column;gap:6px;text-align:center}
.card b{color:var(--acc);font-size:15px}
</style></head><body>
<div id="app">
<div id="hud"><span id="wv"></span><span id="hp"></span><div id="inkw"><div id="ink"></div></div></div>
<div id="stage"><canvas id="c"></canvas><div id="toast"></div><div id="ov"></div></div>
<div id="ctl"><button id="clear">Clear</button><button id="cast">Cast</button></div>
<div id="skills"></div>
</div>
<script>
const CFG={ink:2,R:.055,learn:3,sim:.17,hp:5,autoDelay:1000,idle:1000,skillCd:8000,regen:.15,echoDelay:500,minLen:.2};
const BUFFS={mirror:['Mirror','Reflect your drawing across the centerline. Free.'],kaleido:['Kaleidoscope','Four symmetric copies of your drawing. Ink for the original only.'],slot:['Extra Skill Slot','Hold 4 learned skills instead of 3.'],echo:['Echo','After each cast, repeat it once at half effect on survivors. Free.'],heal:['Full Heal','Restore all hearts. Repeatable.'],ink:['Extra Ink','+10% ink budget. Repeatable.'],regen:['Ink Regen','+10% ink regeneration while drawing. Repeatable.']};
const REP={heal:1,ink:1,regen:1};
const ADJ=['Ember','Gale','Thorn','Wisp','Rune','Frost','Spark','Dusk'];
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let G,W,H,S,bx,by,dpr,aid=null,tt;
const gridFor=w=>Math.min(10,3+Math.floor((w-1)/5));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function resize(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;S=Math.min(W-12,H*.68);bx=(W-S)/2;by=H-S-4}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}

/* ---------- audio (synthesized, no files) ---------- */
const SND={on:true,ac:null};
function audioInit(){if(!SND.ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;SND.ac=new A();SND.m=SND.ac.createGain();SND.m.gain.value=.5;SND.m.connect(SND.ac.destination);setInterval(music,500)}if(SND.ac.resume)SND.ac.resume()}
function tone(f,d,type,v,sl){if(!SND.on||!SND.ac)return;const a=SND.ac,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(SND.m);o.start(t);o.stop(t+d)}
function noise(d,v,fr){if(!SND.on||!SND.ac)return;const a=SND.ac,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fr||1200;g.gain.value=v||.3;s.connect(f);f.connect(g);g.connect(SND.m);s.start()}
const sfx={cast:()=>{tone(300,.25,'sawtooth',.15,900);noise(.15,.15,3000)},perfect:()=>{tone(880,.12,'triangle',.2);tone(1320,.2,'triangle',.15)},good:()=>tone(520,.12,'triangle',.15),miss:()=>tone(160,.15,'square',.08,100),hurt:()=>{tone(120,.3,'sawtooth',.25,50);noise(.2,.25,600)},nova:()=>{tone(200,.5,'sine',.3,800);noise(.4,.2,2000)},storm:()=>{noise(.6,.35,7000);tone(1000,.3,'square',.12,150)},sun:()=>{tone(80,1,'sawtooth',.3,600);noise(.8,.4,3000)},beam:()=>tone(1200,.5,'sawtooth',.15,200),bolt:()=>{noise(.35,.3,6000);tone(900,.2,'square',.1,200)},meteor:()=>{tone(500,.35,'sawtooth',.2,60);setTimeout(()=>{noise(.5,.4,500);tone(70,.5,'sine',.4,30)},350)},learn:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.18),i*90)),clear:()=>[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.15,'square',.1),i*70)),draw:()=>tone(700+Math.random()*100,.04,'sine',.04)};
let mi=0;function music(){if(!G||G.state!='play')return;const sc=[110,131,147,165,196,165,147,131];tone(sc[mi++%8],.45,'triangle',.07);if(mi%4==0)tone(55,.9,'sine',.1)}
/* ---------- timing rule: full damage at 80-100% approach, half at 50-80%, miss below ---------- */
function rf(e){const p=1-Math.max(0,e.d-G.acc/1000)/e.d0,v=p>=.8?1:p>=.5?.5:0,[x,y]=ec(e,G.active.n);
 G.txt.push({x,y,s:v==1?'PERFECT':v?'GOOD':'MISS',c:v==1?'#ffe27a':v?'#bde':'#f88',l:700});
 if(!SND.t||performance.now()-SND.t>120){SND.t=performance.now();sfx[v==1?'perfect':v?'good':'miss']()}return v}
function snake(e,x,y,c,f){
 const k=Math.min(1,G.acc/300),P=e.cells.map(([a,b],i)=>{const q=e.pc&&e.pc[i]||[a,b];return[x+(q[0]+(a-q[0])*k+.5)*c,y+(q[1]+(b-q[1])*k+.5)*c]});
 ctx.save();ctx.lineCap=ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=5;ctx.shadowOffsetY=3;
 for(const [w,col] of[[.8,e.pf==2?'#ffd400':'#1f3d1f'],[.62,e.fl>.4?'#fff':'#4fa84f']]){ctx.strokeStyle=col;ctx.lineWidth=c*w*f;ctx.beginPath();P.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p[0],p[1]));ctx.stroke();ctx.shadowColor='transparent'}
 const h=P[0],u=c*f;ctx.fillStyle='#fff';
 for(const s of[-1,1]){ctx.beginPath();ctx.arc(h[0]+s*u*.17,h[1]-u*.08,u*.11,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(h[0]+s*u*.17,h[1]-u*.08,u*.05,0,7);ctx.fill();ctx.fillStyle='#fff'}
 ctx.font='800 '+Math.max(10,u*.25)+'px system-ui';ctx.textAlign='center';const q=P[1]||h;ctx.fillText(Math.ceil(e.hp),q[0],q[1]+u*.08);ctx.restore();
}
function showMenu(){G.state='menu';const ov=$('ov');
 ov.innerHTML='<h2>Endless Corridor</h2><div style="max-width:340px;text-align:left;font-size:14px;line-height:1.5">• Draw on the paper board. Your drawing casts by itself after 1s idle (or tap Cast). Ink is limited.<br>• <b>Timing matters:</b> enemies take full damage only when 80–100% close (gold outline). 50–80% = half. Farther = miss.<br>• Separate or re-entering strokes hit multiple times. Some enemies are fast, some slow.<br>• Draw the same shape 3× to learn it as a skill; skills recast every 8s.<br>• Spells use 2 strokes: circle+line, two parallel lines, a V, or a cross (see the spellbook at the top).<br>• Boss every 5 waves grows the board. Every 5 waves pick a repeatable buff; every 10, a new ability.</div><button style="padding:0 44px">Play</button><button style="padding:0 20px;min-height:40px;background:#4a4760;color:#f3ead7">Sound: on</button>';
 const[b1,b2]=ov.querySelectorAll('button');b1.onclick=()=>{audioInit();ov.style.display='none';G.state='play'};b2.onclick=()=>{SND.on=!SND.on;b2.textContent='Sound: '+(SND.on?'on':'off')};ov.style.display='flex'}
/* ---------- waves ---------- */
function genWave(w){
 const n=gridFor(w),r=rng(w*7919+13),boss=w%5==0,es=[],occ=Array(n*n).fill(0),base=Math.max(5,8-Math.floor(w/8));
 const fits=(c,y,cw,ch)=>{if(c+cw>n||y+ch>n)return 0;for(let i=0;i<cw;i++)for(let j=0;j<ch;j++)if(occ[(y+j)*n+c+i])return 0;return 1};
 const put=(c,y,cw,ch,type,hp,d)=>{for(let i=0;i<cw;i++)for(let j=0;j<ch;j++)occ[(y+j)*n+c+i]=1;es.push({c,r:y,w:cw,h:ch,type,hp,max:hp,d:Math.ceil(d*.7),d0:d,atk:0,fl:0,id:es.length})};
 if(boss){const k=(w/5)%3,bh=8+2*w;
  if(k==2){const L=Math.min(4,n),cells=[];for(let i=L-1;i>=0;i--)cells.push([i,0,1,1]);const h=Math.round(bh*.8);es.push({c:L-1,r:0,w:1,h:1,cells,type:'snake',hp:h,max:h,d:9,d0:14,atk:0,fl:0,id:0})}
  else if(k==0)put(Math.floor((n-2)/2),0,2,2,'summoner',Math.round(bh*.9),14);
  else{const s=Math.min(n-1,3);put(Math.floor(r()*(n-s+1)),Math.floor(r()*(n-s+1)),s,s,'boss',bh,12)}}
 else{const cnt=Math.min(Math.floor(n*n*.5),2+Math.floor(w/3));
  for(let i=0;i<cnt;i++){const big=w>1&&r()<.3,[cw,ch]=big?(r()<.5?[2,1]:[1,2]):[1,1];
   for(let k=0;k<20;k++){const c=Math.floor(r()*n),y=Math.floor(r()*n);
    if(fits(c,y,cw,ch)){put(c,y,cw,ch,big?'large':'basic',(big?3:1)+Math.floor(w/(big?5:8)),Math.max(3,base+(big?1:0)+[-2,0,0,3][Math.floor(r()*4)]));break}}}}
 return{n,w,es,boss};
}
function newGame(){
 G={wave:1,hp:CFG.hp,state:'play',acc:0,strokes:[],cur:null,inkUsed:0,pend:null,timers:[],fx:[],pts:[],txt:[],sh:0,buffs:{},maxSlots:3,pats:[],slots:[],match:null,hurt:0};
 G.active=genWave(1);G.next=genWave(2);aid=null;$('ov').style.display='none';skills();
 toast('Draw on the board, then press Cast');
}
function advance(){sfx.clear();G.wave++;G.active=G.next;G.next=genWave(G.wave+1);toast(G.active.boss?`Wave ${G.wave} — BOSS`:`Wave ${G.wave}`)}

/* ---------- geometry / strokes ---------- */
const mult=()=>1,maxInk=()=>CFG.ink*(1+.1*(G.buffs.ink||0));
const fx_=s=>s.map(p=>[1-p[0],p[1]]),fy_=s=>s.map(p=>[p[0],1-p[1]]);
function copies(st){
 if(G.buffs.kaleido)return[...st,...st.map(fx_),...st.map(fy_),...st.map(s=>fx_(fy_(s)))];
 if(G.buffs.mirror)return[...st,...st.map(fx_)];
 return st;
}
function samp(s){const o=[];for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],k=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/.02));for(let j=0;j<=k;j++)o.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k])}return o}
function touches(e,pts,n){return(e.cells||[[e.c,e.r,e.w,e.h]]).some(([c,r,w,h])=>{const x0=c/n,x1=(c+w)/n,y0=r/n,y1=(r+h)/n;return pts.some(([x,y])=>Math.hypot(Math.max(x0-x,0,x-x1),Math.max(y0-y,0,y-y1))<=CFG.R)})}

/* ---------- pattern recognition ---------- */
const plen=a=>{let l=0;for(let i=1;i<a.length;i++)l+=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);return l};
function rs(a,n){const I=plen(a)/(n-1);if(I==0)return Array(n).fill(a[0]);let D=0;const o=[a[0]],q=a.map(x=>x.slice());
 for(let i=1;i<q.length;i++){const d=Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]);
  if(D+d>=I){const t=(I-D)/d,m=[q[i-1][0]+t*(q[i][0]-q[i-1][0]),q[i-1][1]+t*(q[i][1]-q[i-1][1])];o.push(m);q.splice(i,0,m);D=0}else D+=d}
 while(o.length<n)o.push(q[q.length-1]);return o.slice(0,n)}
function norm(a){const p=rs(a,32),cx=p.reduce((s,q)=>s+q[0],0)/32,cy=p.reduce((s,q)=>s+q[1],0)/32,an=-Math.atan2(p[0][1]-cy,p[0][0]-cx),c=Math.cos(an),s=Math.sin(an);
 const q=p.map(([x,y])=>[(x-cx)*c-(y-cy)*s,(x-cx)*s+(y-cy)*c]),xs=q.map(v=>v[0]),ys=q.map(v=>v[1]);
 const sz=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))||1;return q.map(([x,y])=>[x/sz,y/sz])}
const pd=(a,b)=>a.reduce((s,q,i)=>s+Math.hypot(q[0]-b[i][0],q[1]-b[i][1]),0)/a.length;
function identify(st){
 const f=st.flat();if(f.length<2||plen(f)<CFG.minLen)return null;
 const n1=norm(f),n2=norm([...f].reverse());let best=null,bd=1e9;
 for(const p of G.pats){const d=Math.min(pd(n1,p.t),pd(n2,p.t));if(d<bd){bd=d;best=p}}
 return{p:bd<CFG.sim?best:null,n1,f};
}
function nm(f,i){const L=plen(f),l=f.at(-1),ch=Math.hypot(f[0][0]-l[0],f[0][1]-l[1]);return ADJ[i%ADJ.length]+' '+(ch<.15*L?'Loop':ch>.85*L?'Slash':'Scrawl')}
/* ---------- spells: drawn shapes with special effects ---------- */
const ci=Array.from({length:40},(_,i)=>[.5+.5*Math.cos(i/39*6.283),.5+.5*Math.sin(i/39*6.283)]);
const SPELLS=[
 {k:'nova',n:'Shield',d:'circle + a line grants a blue shield (max 2)',c:'#5bb8ff',i:[ci,[[0,.5],[1,.5]]]},
 {k:'beam',n:'Twin Beam',d:'two parallel lines pierce the board',c:'#ffe27a',i:[[[0,.3],[1,.3]],[[0,.7],[1,.7]]]},
 {k:'bolt',n:'Lightning',d:'a V of two lines chains to 4 foes',c:'#fff6a8',i:[[[0,0],[.5,1]],[[.5,1],[1,0]]]},
 {k:'meteor',n:'Meteor',d:'cross two lines to call a meteor',c:'#ff9a3c',i:[[[0,0],[1,1]],[[1,0],[0,1]]]},
 {k:'storm',n:'Tempest',d:'3 long parallel lines: lightning rain on all',c:'#9fd0ff',need:2.4,i:[[[0,.2],[1,.2]],[[0,.5],[1,.5]],[[0,.8],[1,.8]]]},
 {k:'sun',n:'Supernova',d:'two big nested circles: board-wide blast',c:'#fff3b0',need:3,i:[ci,ci.map(p=>[.5+(p[0]-.5)*.5,.5+(p[1]-.5)*.5])]}];

const kind=s=>{const L=plen(s),ch=Math.hypot(s[0][0]-s.at(-1)[0],s[0][1]-s.at(-1)[1]);return L<.15?0:L>.35&&ch<.25*L?'loop':ch>.8*L?'line':0};
function inter(A,B){const p=A[0],q=A.at(-1),r=B[0],s=B.at(-1),d=(q[0]-p[0])*(s[1]-r[1])-(q[1]-p[1])*(s[0]-r[0]);if(!d)return null;const t=((r[0]-p[0])*(s[1]-r[1])-(r[1]-p[1])*(s[0]-r[0]))/d,u=((r[0]-p[0])*(q[1]-p[1])-(r[1]-p[1])*(q[0]-p[0]))/d;return t>.12&&t<.88&&u>.12&&u<.88?[p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]:null}
// spells need exactly 2 strokes: circle+line, two parallel lines, V, cross
const cen=s=>[0,1].map(i=>s.reduce((q,p)=>q+p[i],0)/s.length);
function tempest(st){if(!st.every(s=>kind(s)=='line'&&plen(s)>.6))return null;const d=s=>{const u=[s.at(-1)[0]-s[0][0],s.at(-1)[1]-s[0][1]],l=Math.hypot(...u)||1;return[u[0]/l,u[1]/l]},a=d(st[0]);return st.every(s=>{const b=d(s);return Math.abs(a[0]*b[0]+a[1]*b[1])>.85})?SPELLS.find(s=>s.k=='storm'):null}
// Tempest and Supernova are locked until max ink (Extra Ink buffs) reaches their cost
const spellOf=st=>{const x=shape(st);return x&&maxInk()>=(x.need||0)?x:null};
function shape(st){if(st.length==3)return tempest(st);if(st.length!=2)return null;const[A,B]=st,ka=kind(A),kb=kind(B),by=k=>SPELLS.find(s=>s.k==k);
 if(ka=='loop'&&kb=='loop'&&plen(A)>1&&plen(B)>1&&Math.hypot(cen(A)[0]-cen(B)[0],cen(A)[1]-cen(B)[1])<.12)return by('sun');
 if(ka=='loop'&&kb=='line'||ka=='line'&&kb=='loop')return by('nova');
 if(ka!='line'||kb!='line')return null;
 const u=[A.at(-1)[0]-A[0][0],A.at(-1)[1]-A[0][1]],v=[B.at(-1)[0]-B[0][0],B.at(-1)[1]-B[0][1]],c=Math.abs(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);
 if(inter(A,B)&&c<.9)return by('meteor');
 if(Math.min(...[A[0],A.at(-1)].flatMap(p=>[B[0],B.at(-1)].map(q=>Math.hypot(p[0]-q[0],p[1]-q[1]))))<.12&&c<.92)return by('bolt');
 return c>.9?by('beam'):null}
const ec=(e,n)=>[(e.c+e.w/2)/n,(e.r+e.h/2)/n];
const dE=(e,x,y,n)=>Math.min(...(e.cells||[[e.c,e.r,e.w,e.h]]).map(([c,r,w,h])=>Math.hypot(Math.max(c/n-x,0,x-(c+w)/n),Math.max(r/n-y,0,y-(r+h)/n))));
function burst(x,y,n,c){for(let i=0;i<n;i++){const an=Math.random()*6.283,v=.15+Math.random()*.6;G.pts.push({x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,l:400+Math.random()*500,c})}}
function volley(cps,sp,m,echo,col){const wv=G.active;if(sp){sfx[sp.k]();for(let i=0;i<cps.length;i+=sp.k=='storm'?3:2)spellFire(sp.k,cps.slice(i,i+(sp.k=='storm'?3:2)),m,wv);G.fx.push({cps,t:0,echo,col})}else{sfx.cast();strike(cps,m,echo,col)}}
function spellFire(k,P,m,wv){const[A,B]=P;
 if(k=='storm'||k=='sun')spellOld(k,P.flat(),m,wv);
 else if(k=='nova')spellOld(k,kind(A)=='loop'?A:B,m,wv);
 else if(k=='beam')P.forEach(s=>spellOld(k,s,m,wv));
 else if(k=='meteor'){const X=inter(A,B)||A[0];spellOld(k,[X,X],m,wv)}
 else{let best=9,a=A,b=B;for(const p of[0,1])for(const q of[0,1]){const pa=A.at(p?-1:0),pb=B.at(q?-1:0),d=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]);if(d<best){best=d;a=p?A:[...A].reverse();b=q?[...B].reverse():B}}spellOld(k,[...a,...b],m,wv)}}
function spellOld(k,s,m,wv){

  if(f.cps)inkPath(f.cps,f.echo?'#b46bff':(f.col||'#ffb347'),a*(f.echo?.8:1),true);else spellFx(f,a)}
 for(const p of G.pts){ctx.globalAlpha=Math.min(1,p.l/400);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(bx+p.x*S,by+p.y*S,3,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.font='800 15px system-ui';ctx.textAlign='center';
 for(const t of G.txt){ctx.globalAlpha=Math.min(1,t.l/300);ctx.fillStyle=t.c;ctx.fillText(t.s,bx+t.x*S,by+t.y*S-(700-t.l)/700*30)}ctx.globalAlpha=1;
 if(G.sh){ctx.strokeStyle='rgba(91,184,255,.6)';ctx.lineWidth=3*G.sh;ctx.strokeRect(bx,by,S,S)}
 if(G.hurt>0){ctx.fillStyle=`rgba(255,40,40,${G.hurt*.35})`;ctx.fillRect(0,0,W,H)}
 const ac=G.pend??G.idle;if(ac!=null&&ac>0){ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillText('AUTO-CAST '+(ac/1000).toFixed(1)+'s',W/2,by-6)}
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(100,now-last);last=now;update(dt);draw();ui();requestAnimationFrame(loop)}
new ResizeObserver(resize).observe($('stage'));
